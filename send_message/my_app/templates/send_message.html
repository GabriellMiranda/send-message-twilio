<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Mensagem pelo WhatsApp</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4cb1a0, #2C6B31); /* Cor de fundo gradiente */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
        }
        label {
            font-size: 16px;
            color: #555;
            margin-bottom: 10px;
            display: block;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Enviar Mensagem pelo WhatsApp</h2>
        <form method="POST">
            {% csrf_token %}
            <label for="message">Mensagem:</label>
            <input type="text" id="message" name="message" placeholder="Digite sua mensagem" required>

            <label for="whatsapp_number">Número do WhatsApp:</label>
            <input type="text" id="whatsapp_number" name="whatsapp_number" placeholder="Digite o número com DDD" required>

            <button type="submit">Enviar</button>
        </form>
    </div>
</body>
</html>
